version = 1

# Default: code is Apache-2.0, everything else original (3D models, research notes,
# design notes, lesson material, docs) is CC-BY-SA-4.0. More specific annotations
# below override these defaults (REUSE: last match wins). Third-party material has
# its own annotations at the end, with its own licences; their texts are in LICENSES/.

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 jacquard-loom-simulator contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["**/*.js", "**/*.mjs", "**/*.py", "**/*.sh", "**/*.json", "**/*.toml", "**/*.yaml", "**/*.yml", "**/*.html", "**/*.css", ".gitattributes", ".gitignore", ".editorconfig", ".npmrc", "**/*.webmanifest", ".github/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 jacquard-loom-simulator contributors"
SPDX-License-Identifier = "Apache-2.0"

# Research data and parameters are content, not code.
[[annotations]]
path = ["research/data/**", "params/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 jacquard-loom-simulator contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# ---- Third-party material ----------------------------------------------------

# Vendored libraries, copied unchanged from npm (pnpm vendor); each keeps its LICENSE.
[[annotations]]
path = "vendor/three/**"
precedence = "override"
SPDX-FileCopyrightText = "2010-2026 three.js authors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "vendor/roboto-flex/**"
precedence = "override"
SPDX-FileCopyrightText = "2017 The Roboto Flex Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "vendor/material-symbols/**"
precedence = "override"
SPDX-FileCopyrightText = "Google LLC"
SPDX-License-Identifier = "Apache-2.0"

# The name game's font: the ASCII glyphs of Unscii 8 x 16 (Viznut, http://viznut.fi/unscii/),
# public domain.
[[annotations]]
path = "js/game/unscii16.js"
precedence = "override"
SPDX-FileCopyrightText = "Viznut (Unscii font)"
SPDX-License-Identifier = "LicenseRef-PublicDomain"

# Wikimedia Commons and Flickr photos, Wellcome, Rijksmuseum, Met and Cooper Hewitt images:
# mixed licences. The authoritative per-file licence, author and source URL are in
# research/data/photo_catalog.json (and research/images/ATTRIBUTION.md).
[[annotations]]
path = "research/images/commons/**"
precedence = "override"
SPDX-FileCopyrightText = "Wikimedia Commons and Flickr contributors (see research/data/photo_catalog.json)"
SPDX-License-Identifier = "CC0-1.0 OR LicenseRef-PublicDomain OR CC-BY-2.0 OR CC-BY-3.0 OR CC-BY-4.0 OR CC-BY-SA-2.0 OR CC-BY-SA-3.0 OR CC-BY-SA-4.0 OR GFDL-1.2-or-later"

# Plates from Posselt (1887), Barlow (1878) and Ure (1839), scanned by the Internet Archive:
# public domain.
[[annotations]]
path = "research/images/pd-scans/**"
precedence = "override"
SPDX-FileCopyrightText = "E. A. Posselt (1887); A. Barlow (1878); A. Ure (1839) - public domain"
SPDX-License-Identifier = "LicenseRef-PublicDomain"

# The tutorial's pictures (js/teach/tutorial.js), scaled and re-encoded from research/images;
# each one's credit is shown with it (js/l10n, img.*).
[[annotations]]
path = ["images/tutorial/draw-loom.jpg"]
precedence = "override"
SPDX-FileCopyrightText = "Alfred Barlow (1878), scan by the Internet Archive - public domain"
SPDX-License-Identifier = "LicenseRef-PublicDomain"

[[annotations]]
path = ["images/tutorial/cards.jpg"]
precedence = "override"
SPDX-FileCopyrightText = "Robert-brook (Wikimedia Commons)"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["images/tutorial/model-1810.jpg"]
precedence = "override"
SPDX-FileCopyrightText = "MdeVicente (Wikimedia Commons)"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["images/tutorial/portrait.jpg"]
precedence = "override"
SPDX-FileCopyrightText = "Wellcome Collection (photograph of the woven portrait of J.-M. Jacquard, Lyon, 1839)"
SPDX-License-Identifier = "CC-BY-4.0"
