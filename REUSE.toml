version = 1

# Default: code is Apache-2.0, everything else original (3D models, research notes,
# design notes, lesson material, docs) is CC-BY-SA-4.0. More specific annotations
# below override these defaults (REUSE: last match wins). Third-party material has
# its own annotations at the end, with its own licences; their texts are in LICENSES/.

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 jacquard-loom-simulator contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["**/*.js", "**/*.mjs", "**/*.py", "**/*.sh", "**/*.json", "**/*.toml", "**/*.yaml", "**/*.yml", "**/*.html", "**/*.css", ".gitattributes", ".gitignore", ".editorconfig", ".npmrc", "**/*.webmanifest", ".github/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 jacquard-loom-simulator contributors"
SPDX-License-Identifier = "Apache-2.0"

# Research data and parameters are content, not code.
[[annotations]]
path = ["research/data/**", "params/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 jacquard-loom-simulator contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# ---- Third-party material ----------------------------------------------------
